# dnsmasq configuration for Site 1 (hS1dns)
# Provides DHCP + DNS for every VLAN at Site 1.
#
# Interface order MUST match the link order created in site_1.py:
#   eth0 -> Sales (VLAN 10)        10.0.10.0/25
#   eth1 -> Management (VLAN 20)   10.0.10.128/25
#   eth2 -> Guests (VLAN 30)       10.0.11.0/24
#   eth3 -> Surveillance (VLAN 40) 10.0.12.0/24
#   eth4 -> Kitchen (VLAN 50)      10.0.13.0/27
#   eth5 -> VoIP (VLAN 60)         10.0.13.64/26

domain-needed
bogus-priv
expand-hosts
domain=site1.local
local=/site1.local/

# Only listen on loopback + this site's VLAN interfaces
interface=lo
interface=hS1dns-eth0
interface=hS1dns-eth1
interface=hS1dns-eth2
interface=hS1dns-eth3
interface=hS1dns-eth4
interface=hS1dns-eth5
bind-interfaces
no-resolv
dhcp-authoritative

# --- VLAN 10: Sales (10.0.10.0/25, gw 10.0.10.1) ---
dhcp-range=set:sales,10.0.10.10,10.0.10.120,255.255.255.128,12h
dhcp-option=tag:sales,3,10.0.10.1
dhcp-option=tag:sales,6,10.0.10.2

# --- VLAN 20: Management (10.0.10.128/25, gw 10.0.10.129) ---
dhcp-range=set:mgmt,10.0.10.140,10.0.10.250,255.255.255.128,12h
dhcp-option=tag:mgmt,3,10.0.10.129
dhcp-option=tag:mgmt,6,10.0.10.130

# --- VLAN 30: Guests (10.0.11.0/24, gw 10.0.11.1) ---
dhcp-range=set:guests,10.0.11.10,10.0.11.250,255.255.255.0,12h
dhcp-option=tag:guests,3,10.0.11.1
dhcp-option=tag:guests,6,10.0.11.2

# --- VLAN 40: Surveillance (10.0.12.0/24, gw 10.0.12.1) ---
dhcp-range=set:surveillance,10.0.12.10,10.0.12.250,255.255.255.0,12h
dhcp-option=tag:surveillance,3,10.0.12.1
dhcp-option=tag:surveillance,6,10.0.12.2

# --- VLAN 50: Kitchen (10.0.13.0/27, gw 10.0.13.1) ---
dhcp-range=set:kitchen,10.0.13.10,10.0.13.30,255.255.255.224,12h
dhcp-option=tag:kitchen,3,10.0.13.1
dhcp-option=tag:kitchen,6,10.0.13.2

# --- VLAN 60: VoIP (10.0.13.64/26, gw 10.0.13.65) ---
dhcp-range=set:voip,10.0.13.70,10.0.13.126,255.255.255.192,12h
dhcp-option=tag:voip,3,10.0.13.65
dhcp-option=tag:voip,6,10.0.13.66

# --- Local DNS records for this site ---
address=/dns.site1.local/10.0.10.2
address=/hs1dns.site1.local/10.0.10.2

# --- DNS fallback / forwarding to HQ ---
# hq.local and site2.local are resolved via HQ's DNS server.
# Anything else not known locally is also forwarded to HQ (catch-all fallback).
server=/hq.local/10.0.17.69
server=/site2.local/10.0.17.69
server=10.0.17.69

log-queries
log-dhcp
