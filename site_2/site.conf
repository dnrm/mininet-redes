# dnsmasq configuration for Site 2 (hS2dns)
# Provides DHCP + DNS for every VLAN at Site 2.
#
# Interface order MUST match the link order created in site_2.py:
#   eth0 -> Sales (VLAN 10)        10.0.13.128/25
#   eth1 -> Management (VLAN 20)   10.0.14.0/25
#   eth2 -> Guests (VLAN 30)       10.0.15.0/24
#   eth3 -> Surveillance (VLAN 40) 10.0.16.0/24
#   eth4 -> VoIP (VLAN 50)         10.0.17.0/26

domain-needed
bogus-priv
expand-hosts
domain=site2.local
local=/site2.local/

# Only listen on loopback + this site's VLAN interfaces
interface=lo
interface=hS2dns-eth0
interface=hS2dns-eth1
interface=hS2dns-eth2
interface=hS2dns-eth3
interface=hS2dns-eth4
bind-interfaces
no-resolv
dhcp-authoritative

# --- VLAN 10: Sales (10.0.13.128/25, gw 10.0.13.129) ---
dhcp-range=set:sales,10.0.13.140,10.0.13.250,255.255.255.128,12h
dhcp-option=tag:sales,3,10.0.13.129
dhcp-option=tag:sales,6,10.0.13.130

# --- VLAN 20: Management (10.0.14.0/25, gw 10.0.14.1) ---
dhcp-range=set:mgmt,10.0.14.10,10.0.14.120,255.255.255.128,12h
dhcp-option=tag:mgmt,3,10.0.14.1
dhcp-option=tag:mgmt,6,10.0.14.2

# --- VLAN 30: Guests (10.0.15.0/24, gw 10.0.15.1) ---
dhcp-range=set:guests,10.0.15.10,10.0.15.250,255.255.255.0,12h
dhcp-option=tag:guests,3,10.0.15.1
dhcp-option=tag:guests,6,10.0.15.2

# --- VLAN 40: Surveillance (10.0.16.0/24, gw 10.0.16.1) ---
dhcp-range=set:surveillance,10.0.16.10,10.0.16.250,255.255.255.0,12h
dhcp-option=tag:surveillance,3,10.0.16.1
dhcp-option=tag:surveillance,6,10.0.16.2

# --- VLAN 50: VoIP (10.0.17.0/26, gw 10.0.17.1) ---
dhcp-range=set:voip,10.0.17.10,10.0.17.60,255.255.255.192,12h
dhcp-option=tag:voip,3,10.0.17.1
dhcp-option=tag:voip,6,10.0.17.2

# --- Local DNS records for this site ---
address=/dns.site2.local/10.0.13.130
address=/hs2dns.site2.local/10.0.13.130

# --- DNS fallback / forwarding to HQ ---
# hq.local and site1.local are resolved via HQ's DNS server.
# Anything else not known locally is also forwarded to HQ (catch-all fallback).
server=/hq.local/10.0.17.69
server=/site1.local/10.0.17.69
server=10.0.17.69

log-queries
log-dhcp
